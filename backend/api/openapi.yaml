openapi: 3.0.3
info:
  title: BookDan API
  version: 0.1.0
  description: |
    Contract between the Go backend and the mobile apps. This file is the single source of truth:
    the mobile API client is generated from it, and a change here must fail the mobile build if the app no longer matches.

    Conventions
    - Base path /v1 over HTTPS.
    - Request headers: Authorization (Bearer), Accept-Language (en, am, om, ti), X-App (guest or partner), X-Device-Id (the install's id, 8+ characters),
      X-Platform (android, ios), X-App-Version. Creating a hold also sends Idempotency-Key.
    - Endpoints marked 200 are built (internal/api); 501 NOT_IMPLEMENTED means not built yet.
    - Every response body includes server_time (apps use it for countdowns, never the phone clock).
    - Money fields end in _santim and are integers, with a currency field beside them.
    - Errors use one shape: code, message, request_id, details.
    - Lists use cursor pagination: items and next_cursor.
servers:
  - url: http://localhost:8080/v1
paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/otp/request:
    post:
      summary: Send a one-time code by SMS (phone) or email
      description: |
        Body: { "type": "phone" | "email", "value": "+2519..." | "name@example.com" }. Phones are Ethiopian (+2519 or +2517);
        email is for visitors without an Ethiopian number and is lower-cased. At most 5 codes per identifier per 10 minutes (429 TOO_MANY_REQUESTS).
        Codes last 5 minutes. Errors: INVALID_PHONE, INVALID_EMAIL, SEND_FAILED (502: the provider could not send it), and 503 PHONE_SIGNIN_OFF when the server has phone sign-in switched off (OTP_PROVIDER=off): use email.
      responses: { "200": { description: Code sent } }
  /auth/otp/verify:
    post:
      summary: Exchange the identity plus code for access and refresh tokens
      description: |
        Body: { "type", "value", "code" }. Headers X-App and X-Device-Id are required. Five wrong codes spend the challenge.
        Response: { token, refresh_token }. The access token lasts 15 minutes. The partner app admits only hotel staff (403 NOT_STAFF).
        Errors: INVALID_OTP.
      responses: { "200": { description: Signed in } }
  /auth/refresh:
    post:
      summary: Trade a refresh token for a new pair (rotation)
      description: |
        Body: { "refresh_token" }. A refresh token works once. Presenting a used one means a copy leaked: the whole session family is revoked
        and every token in it fails with 401 UNAUTHENTICATED.
      responses: { "200": { description: New tokens } }
  /keys/voucher:
    get:
      summary: The public key that verifies voucher QR codes offline (Ed25519)
      responses: { "200": { description: "kid, alg and public_key (base64url)" } }
  /search:
    get:
      summary: Search properties by landmark, city, name or coordinates
      description: |
        Dates are optional. With check_in and check_out, they must be today or later (Addis Ababa time) and at most 365 days ahead
        (400 otherwise); the stay is 1 to 30 nights. Every hotel that matches the words and filters is listed; a hotel with no room for the
        whole stay has available=false ("sold out for these dates"). On the first page, other_dates lists up to 10 such hotels with up to
        3 stays each (windows: nearby dates or part of the stay) that the hotel can sell; nothing is held by a suggestion.
        Without dates, hotels come back with a "from" price for tonight and dates_known=false: no claim is made about rooms.
        Reads and bookings are rate-limited per address (429 TOO_MANY_REQUESTS with Retry-After): 600 and 60 a minute by default in production.
      responses: { "200": { description: OK }, "400": { description: Bad dates or party size }, "429": { description: Too many requests } }
  /properties/{id}:
    get:
      summary: Property detail with room types, prices and reviews
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /quotes:
    post:
      summary: Price a stay (valid 10 minutes)
      description: |
        Body: { property_id, room_type_id, check_in, check_out, guests, rooms? } (1 to 9 rooms of one type; guests >= rooms).
        Amounts cover all rooms: nightly_santim is one room for one night; subtotal_santim, vat_santim and total_santim are for the stay.
        Optional: meal (room_only | breakfast), refundable (default true), coupon_code and children (each room needs an adult). The answer says what was chosen, discount_santim (how much cheaper the total is, VAT included)
        and list_total_santim (the price without the coupon). pay_at_hotel is false whenever a coupon is applied.
        Errors: SOLD_OUT (not enough rooms for every night), INVALID_STATE (too many guests, no price for those dates), PRICING_NOT_CONFIRMED.
        Also: OPTION_UNAVAILABLE (the room does not offer that meal or non-refundable), COUPON_INVALID (the message says why).
      responses: { "200": { description: Quote } }
  /suggest:
    get:
      summary: Place suggestions as the guest types (public)
      description: Landmarks, areas and cities with a published hotel, and hotels by name. With q empty, the popular landmarks. Each item has kind (landmark, area, city, hotel), text, subtitle and, for a hotel, property_id.
      responses: { "200": { description: Up to 10 suggestions } }
  /bookings:
    get:
      summary: The signed-in guest's bookings
      responses: { "200": { description: OK } }
    post:
      summary: Hold the rooms for 15 minutes. Requires Idempotency-Key.
      description: |
        Body: { quote_id, guest_name }. Takes every room on every night, or none. Freezes a copy of the guest's profile for the hotel.
        The same key and request returns the same booking; the same key with another request is IDEMPOTENCY_MISMATCH.
        Errors: QUOTE_EXPIRED, SOLD_OUT, PROFILE_INCOMPLETE.
      responses: { "200": { description: Booking (HELD) } }
  /bookings/{id}:
    get:
      summary: Booking status and amounts
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /bookings/{id}/pay:
    post:
      summary: Start payment; returns a payment_url (mock gateway in the demo)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /bookings/{id}/cancel:
    post:
      summary: Cancel a booking that is waiting for the hotel or confirmed
      description: |
        Refund rule: everything back while the hotel has not answered; after it confirmed, everything back until 48 hours before check-in (12:00 Addis time), nothing after. The booking response says in advance what applies: can_cancel, refund_if_cancelled_santim, full_refund_until. Errors: INVALID_STATE, CANCEL_TOO_LATE (the stay has started). Returns the booking with refund_santim.
      responses: { "200": { description: Booking (cancelled) } }
  /bookings/{id}/review:
    post:
      summary: Review a finished stay (once per booking)
      description: |
        Body: { rating 1-5, text up to 1000 characters }. Errors: REVIEW_NOT_READY (before check-out), ALREADY_REVIEWED. Returns the booking with review.
      responses: { "200": { description: Booking (with the review) } }
  /bookings/{id}/voucher:
    get:
      summary: Signed voucher token and PIN (PIN shown once)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /partner/devices/push-token:
    put:
      summary: Register this phone for new-booking alerts
      description: |
        Body: token (the phone's FCM token), token_type "fcm", device_id (the X-Device-Id), platform, app_version.
        Replaces any earlier token for the same device. When a guest pays, the server pushes
        { "type": "new_booking", "booking_id": "..." } to the hotel's registered phones on the Android channel
        "booking_alerts" (highest importance, its own sound). The countdown and the escalation chain
        (Telegram, SMS, automated call) run on the server; the app only shows the countdown.
      responses: { "200": { description: OK } }
  /me/profile:
    get:
      summary: The signed-in guest's own profile (masked), or 404 if they have not filled it in
      description: |
        Returns full_name, id_type, id_last4, nationality. Never the full ID number.
      responses: { "200": { description: OK } }
    put:
      summary: Save the guest's name, ID and nationality
      description: |
        Body: full_name, id_type (national_id, passport, driving_licence, residence_permit, other), id_number,
        nationality. The server normalises the number (INVALID_ID if it cannot be an ID), encrypts it (AES-GCM, key
        kept outside the database), and stores a keyed hash and the last four characters. Requires Idempotency-Key.
      responses: { "200": { description: OK } }
    delete:
      summary: Remove the guest's ID details
      description: Deletes the profile. Copies already given to hotels for requested stays stay until the retention job erases them.
      responses: { "200": { description: OK } }
  /me/account:
    delete:
      summary: Close the guest's account
      description: |
        Body: {"confirm": "DELETE"}. Refused with 409 ACTIVE_BOOKINGS while a booking is held, paid, confirmed or checked in (cancel first).
        Removes the profile and full ID number, the phone numbers and notes on bookings, the text of reviews, the sign-in codes; revokes every
        session and phone at once (existing tokens stop working immediately); frees the email address (signing in with it later starts an
        empty account). Bookings, the ledger and the hotel's copy of the guest's name are kept as records.
      responses: { "200": { description: OK }, "400": { description: Missing confirmation }, "409": { description: ACTIVE_BOOKINGS } }
  /me/export:
    get:
      summary: Everything the app holds about the guest, as one JSON document
      description: email, phone, profile (ID masked to the last four characters), bookings and reviews. Never the full ID number.
      responses: { "200": { description: OK } }
  /rates:
    get:
      summary: Display exchange rates (public)
      description: |
        {"base": "ETB", "rates": [{"currency": "USD" or "EUR", "birr_per_unit": 148.5, "updated_at": ..., "stale": false}]}. Birr for one dollar or euro, set by a
        platform admin. For display only: BookDan always charges and refunds in ETB. A rate not updated for 30 days is marked stale and the apps
        ignore it (ETB only). An empty list means no rate is set. Cached for five minutes.
      responses: { "200": { description: OK } }
  /admin/rates:
    get:
      summary: The display rates with who set them (platform admin only)
      responses: { "200": { description: OK } }
  /admin/rates/{currency}:
    put:
      summary: Set the birr rate for USD or EUR (platform admin only)
      description: |
        Body: {"birr_per_unit": 1 to 10000, "confirm": optional}. A change of more than 30% from the current rate is refused with 409 RATE_JUMP
        unless "confirm" is true (a guard against typos). 404 for any other currency (ETB is the base).
      parameters: [{ name: currency, in: path, required: true, schema: { type: string, enum: [USD, EUR] } }]
      responses: { "200": { description: OK }, "400": { description: Invalid rate }, "404": { description: Not USD or EUR }, "409": { description: RATE_JUMP } }
  /bookings/{id}/call:
    post:
      summary: Log that the guest tapped "Call the hotel"
      description: |
        The hotel's number is not on its page (property.phone is empty): a guest gets it once a booking is CONFIRMED or CHECKED_IN (booking.property_phone, empty
        before and after; also in the voucher and the confirmation email). This call logs a tap so the admin page can show how often guests call hotels. 409 before the
        number is shown, 404 for someone else's booking. Best effort: the app never blocks the call on it.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "404": { description: Not the guest's booking }, "409": { description: Number not shown yet } }
  /hotel-applications:
    post:
      summary: A hotel applies to be listed (public)
      description: |
        Body: {hotel_name, hotel_type, city, area, address, hotel_phone, description, rooms_count, pay_at_hotel, owner_name, owner_email, owner_phone, legal_name, license_number}.
        The public page /apply posts here. The applicant gets a receipt by email and the admins are told. At most 5 applications per connection per hour (429) and 2 waiting per
        email (409 APPLICATION_WAITING). A hidden field named website is a bot trap: filled, the call answers 200 and keeps nothing. {reference: "HA-XXXXXXXX"}.
      responses: { "200": { description: Received }, "400": { description: Invalid }, "409": { description: Applications waiting }, "429": { description: Too many } }
  /admin/applications:
    get:
      summary: Hotel applications, waiting ones first (platform admin only)
      responses: { "200": { description: "{applications: [...]}" } }
  /admin/applications/{id}/approve:
    post:
      summary: Approve an application (platform admin only)
      description: Creates a DRAFT hotel (at Addis Ababa's centre until its pin is set), makes the applicant its owner, and emails them the invitation and the good news. {property_id}. 409 if decided already.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "404": { description: Unknown }, "409": { description: Already decided, or the email belongs to a platform admin } }
  /admin/applications/{id}/reject:
    post:
      summary: Reject an application (platform admin only)
      description: 'Body: {"note": 3 to 1000 characters}; the applicant is emailed the reason. 409 if decided already.'
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "400": { description: Reason missing }, "409": { description: Already decided } }
  /admin/analytics:
    get:
      summary: Marketplace numbers for the last N days (platform admin only)
      description: |
        Query days (1 to 365, default 30; Addis Ababa days). The funnel (quotes, holds, paid, confirmed, completed), where bookings ended without a stay (expired, declined,
        no answer, cancelled by guest, hotel or admin, no-shows), money in santim (gmv = the price of what hotels confirmed, commission and its VAT, refunds), new and
        returning guests, what waits for a person now (open support requests, disputes, relocations, payment issues, bookings awaiting a hotel), a point per day
        (bookings, confirmed, gmv), and per hotel (confirmed, value, requests, accepted, declined, no answer, average reply minutes, its own cancellations).
      responses: { "200": { description: OK } }
  /admin/reviews:
    get:
      summary: Reviews for moderation (platform admin only)
      description: |
        Query status (visible, the default; hidden; all), hotel (id), q (words in the review or a booking code), sort (latest, the default; lowest). Up to 100.
        {reviews: [{id, hotel, hotel_id, author, booking_code, rating, text, date, reply, hidden, hidden_at, hidden_reason, hidden_by}]}.
      responses: { "200": { description: OK } }
  /admin/reviews/{id}/hide:
    post:
      summary: Hide a review (platform admin only)
      description: |
        Body {"reason": "3 to 300 characters"}. A hidden review is left out of the hotel page, the hotel's rating and the owner's list, the hotel can no longer reply to it,
        and the guest who wrote it still sees it. 409 INVALID_STATE if it is already hidden. Recorded in the audit log (review_hidden).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Hidden }, "400": { description: No reason }, "404": { description: No such review }, "409": { description: Already hidden } }
  /admin/reviews/{id}/restore:
    post:
      summary: Show a hidden review again (platform admin only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Shown }, "404": { description: No such review }, "409": { description: Not hidden } }
  /admin/calls:
    get:
      summary: Calls logged per hotel and the latest ones (platform admin only)
      description: Query days (1 to 365, default 30). {hotels: [{id, name, calls, bookings_with_calls, confirmed_bookings, last_call_at}], recent: [{at, hotel, booking_code, guest_name, status}]}.
      responses: { "200": { description: OK } }
  /me/saved:
    get:
      summary: The guest's saved hotels (wishlist), newest first
      description: "{items: [{property_id, saved_at}]}. Kept on the server so the list follows the guest to a new phone; the app also keeps it on the phone."
      responses: { "200": { description: OK }, "401": { description: Not signed in } }
  /me/saved/sync:
    post:
      summary: Sync the saved hotels with what changed on the phone
      description: |
        Body {"add": [property ids], "remove": [property ids]} (at most 500 each). A hotel in both lists is removed; ids of hotels that do not exist or are not published are
        ignored; at most 200 hotels can be saved (the sync then returns the list the server holds). The answer is the whole list: {items: [{property_id, saved_at}]}.
      responses: { "200": { description: The whole list }, "400": { description: Not a hotel id, or too many } }
  /me/saved/{propertyId}:
    put:
      summary: Save a hotel (saving twice is fine; 404 if it does not exist or is not published; 409 SAVED_FULL at 200 hotels)
      parameters: [{ name: propertyId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Saved }, "404": { description: No such hotel }, "409": { description: SAVED_FULL } }
    delete:
      summary: Remove a saved hotel (removing twice is fine)
      parameters: [{ name: propertyId, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: Removed } }
  /bookings/{id}/change-dates/quote:
    post:
      summary: What moving a confirmed booking to other dates would cost or return (changes nothing)
      description: |
        Body: {"check_in": "YYYY-MM-DD", "check_out": "YYYY-MM-DD"}. Same rules as change-dates for who may move a booking and when. Answer: {kind, check_in, check_out, nights,
        currency, old_total_santim, new_total_santim, difference_santim, pay_now_santim, refund_now_santim, old_balance_due_santim, new_balance_due_santim, difference_at_hotel}.
        kind is same_price (nothing changes), refund (the new dates cost less: refund_now_santim goes back to the guest), pay (they cost more: pay_now_santim is paid now) or
        reprice (nothing is paid through BookDan, or only the balance due at the hotel changes: difference_at_hotel).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: The quote }, "400": { description: Invalid dates }, "404": { description: Not the guest's booking }, "409": { description: See change-dates } }
  /bookings/{id}/change-dates:
    post:
      summary: Move a confirmed booking to other dates, once
      description: |
        Body: {"check_in", "check_out", "confirm_total_santim": the new total the guest saw in the quote (needed when the price differs), "method": "chapa" or "telebirr" (when a payment is needed)}.
        Allowed (booking.can_change_dates) for a CONFIRMED, refundable booking with no coupon that was not moved before, while both the old and the new check-in are more than 48 hours
        away and the same room type is free on every new night. By the quote's kind:
        same_price: the booking moves; reprice: it moves and is repriced, nothing is paid through BookDan; refund: it moves, is repriced, and the difference goes back to the guest as
        a partial refund that the hotel bears; pay: nothing moves yet. The new nights are held for 15 minutes and booking.pending_date_change carries the payment page for the difference;
        when that payment arrives the booking moves, is repriced, and the hotel's share and BookDan's commission on the extra money are booked. If it does not arrive in time the request
        ends and the booking stays as it was; money that arrives later is refunded. The hotel is alerted and the guest emailed once the booking has moved; the first dates stay in
        original_check_in/out. Errors: 400 invalid dates; 404; 409 with code INVALID_STATE, CHANGE_LIMIT, NON_REFUNDABLE, COUPON_NO_CHANGE, CHANGE_TOO_LATE, NEW_DATES_TOO_SOON,
        CHANGE_PENDING (one change waits for its payment), SOLD_OUT, or PRICE_DIFFERS (the price differs and confirm_total_santim is missing or not the new total; the message carries it).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: The booking (with pending_date_change when a payment is waited for) }, "400": { description: Invalid dates }, "404": { description: Not the guest's booking }, "409": { description: See above } }
  /bookings/{id}/change-dates/pay:
    post:
      summary: Start or resume the payment of a waiting change of dates
      description: Body {"method": "chapa" | "telebirr"}. Returns the booking; its pending_date_change.payment.payment_url is the page to pay on (the same page while it is still open, a new one after a failed payment). 409 NO_PENDING_CHANGE when nothing waits.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: The booking }, "404": { description: Not the guest's booking }, "409": { description: Nothing is waiting } }
  /bookings/{id}/change-dates/cancel:
    post:
      summary: Drop a change of dates that is waiting for its payment
      description: The held nights are released and the booking stays as it was. A payment that still arrives afterwards is refunded. 409 NO_PENDING_CHANGE when nothing waits.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: The booking }, "404": { description: Not the guest's booking }, "409": { description: Nothing is waiting } }
  /bookings/{id}/dispute:
    post:
      summary: Challenge a charge or a stay
      description: |
        Body: {"reason": "not_as_described", "refused_entry", "charged_wrong", "no_show_wrong" or "other", "message": 10 to 2000 characters}.
        The booking becomes DISPUTED (its money is held back from the hotel) and a support request of kind dispute carries the conversation
        (booking.dispute_ticket_id). Allowed once per booking, from the start of the stay until 14 days after check-out (booking.can_dispute).
        Closing the support request withdraws the dispute and the booking goes back to its status. 409: INVALID_STATE (the stay has not started),
        DISPUTE_WINDOW_CLOSED, DISPUTE_EXISTS.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: The booking }, "400": { description: Invalid }, "404": { description: Not the guest's booking }, "409": { description: See above } }
  /admin/support/tickets/{id}/refund:
    post:
      summary: Refund part of a booking's payment from a support request (platform admin only)
      description: |
        Body: {"payer": "hotel" | "platform", "amount_santim": more than 0 and less than the payment, "note": 3 to 1000 characters, shown to the guest}.
        The booking must be confirmed (CONFIRMED, CHECKED_IN, COMPLETED or NO_SHOW) and the request not closed; an open dispute is settled with its own
        decision. "hotel": the hotel's share, BookDan's commission and its VAT shrink in proportion; "platform": BookDan pays from its own money and the
        hotel keeps its share. Several partial refunds are possible while money is left (409 REFUND_TOO_LARGE otherwise); a later cancellation refunds only
        what is left. The money goes through the gateway and is retried until it is accepted. The guest is emailed.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "400": { description: Invalid amount, payer or reason, or nothing paid online }, "409": { description: Not refundable now, closed, dispute open, or REFUND_TOO_LARGE } }
  /admin/support/tickets/{id}/resolve:
    post:
      summary: Settle a dispute (platform admin only)
      description: |
        Body: {"outcome": "rejected" | "refunded_hotel_pays" | "refunded_platform_pays", "note": 3 to 1000 characters, shown to the guest}.
        rejected: the booking goes back to its status. refunded_hotel_pays: the guest is refunded in full and the hotel's share and the commission
        are reversed (the booking is cancelled). refunded_platform_pays: the guest is refunded in full from BookDan's money (ledger expense
        dispute_expense) and the hotel keeps its share. refunded_partial_hotel_pays and refunded_partial_platform_pays refund only "amount_santim" (more than 0 and
        less than the payment, and at most what is left) and the booking goes back to its status (see /admin/support/tickets/{id}/refund). A refund
        needs an online payment (400 NO_PAYMENT otherwise).
        The guest is emailed the decision. 409 when it is not a dispute or is already settled. Closing a dispute with /close is refused (DISPUTE_OPEN).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "400": { description: Invalid }, "409": { description: Not an open dispute } }
  /support/tickets:
    post:
      summary: Ask support a question or report a problem
      description: |
        Body: {"kind": "question" or "problem", "subject": 3 to 120 characters, "message": 1 to 2000 characters, "booking_id": optional, must be the guest's own booking (else 404)}.
        409 TOO_MANY_TICKETS at five requests still waiting. The admins and SUPPORT_EMAIL are emailed.
      responses: { "200": { description: "{id}" }, "400": { description: Invalid }, "404": { description: Not the guest's own booking }, "409": { description: TOO_MANY_TICKETS } }
    get:
      summary: The guest's own requests, newest activity first (at most 50)
      responses: { "200": { description: "{tickets: [...]}" } }
  /support/tickets/{id}:
    get:
      summary: One request with its messages (staff appear only as Support)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: "{ticket}" }, "404": { description: Not found, or not the guest's own } }
  /support/tickets/{id}/messages:
    post:
      summary: Reply on a request (reopens an answered one)
      description: 'Body: {"message": 1 to 2000 characters}. 409 INVALID_STATE when it is closed.'
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "409": { description: Closed } }
  /support/tickets/{id}/close:
    post:
      summary: Close a request (closing twice is harmless)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /admin/support/tickets:
    get:
      summary: The support queue (platform admin only)
      description: Open requests first, then answered, then closed; at most 200. Includes the guest's contact.
      responses: { "200": { description: "{tickets: [...]}" } }
  /admin/support/tickets/{id}:
    get:
      summary: One request with its messages (platform admin only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: "{ticket}" }, "404": { description: Not found } }
  /admin/support/tickets/{id}/reply:
    post:
      summary: Answer a request; the guest is emailed (platform admin only)
      description: 'Body: {"message": 1 to 2000 characters}. 409 when the request is closed.'
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "409": { description: Closed } }
  /admin/support/tickets/{id}/close:
    post:
      summary: Close a request (platform admin only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /admin/payment-issues:
    get:
      summary: Payments that need a person (platform admin only)
      description: |
        Today one kind, amount_mismatch: the gateway reports a payment whose amount or currency is not what was asked, so the booking was
        NOT confirmed. Open issues first, then the last 50 resolved. The admins (ADMIN_EMAILS) and SUPPORT_EMAIL are emailed once when one is raised.
      responses: { "200": { description: OK } }
  /admin/payment-issues/{id}/resolve:
    post:
      summary: Mark a payment issue resolved (platform admin only)
      description: 'Body: {"note": "what was decided"} (3 to 1000 characters). 409 if it is already resolved.'
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "400": { description: Note missing }, "409": { description: Already resolved } }
  /partner/bookings/{id}/cancel:
    post:
      summary: The hotel cancels a confirmed booking (hotel owners only)
      description: |
        Body: {"reason": "overbooked" | "maintenance" | "emergency" | "other"}. Only for a CONFIRMED booking (or one waiting to be moved) whose stay is not over. The guest is
        refunded in full (what is left after partial refunds) and the hotel bears it: its share, BookDan's commission and the VAT are reversed. Nights still to come
        go back on sale. The guest is told by push and email, and support by email. 403 for a receptionist, 409 INVALID_STATE otherwise.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: The booking }, "400": { description: Unknown reason }, "403": { description: Not a hotel owner }, "404": { description: Not this hotel's booking }, "409": { description: Not cancellable } }
  /partner/bookings/{id}/relocate:
    post:
      summary: The hotel reports that it cannot host the guest (any hotel staff)
      description: |
        Body: {"reason": ...} as for cancel. A CONFIRMED booking becomes NEEDS_RELOCATION and a support request of kind relocation is opened for the guest. The guest can
        cancel at once for a full refund (even a non-refundable booking, and even late). Support finds another place and settles it with
        POST /admin/support/tickets/{id}/relocation (restored or refunded).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: The booking }, "400": { description: Unknown reason }, "404": { description: Not this hotel's booking }, "409": { description: Not confirmed, or the stay is over } }
  /partner/bookings/{id}/dispute:
    get:
      summary: A guest's dispute about this booking, as the hotel sees it
      description: The reason, what the guest wrote and the hotel's own statements. Never what support wrote. 404 when there is no dispute.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: "{dispute: {ticket_id, status, reason, messages: [{role, author, body, created_at}]}}" }, "404": { description: No dispute } }
  /partner/bookings/{id}/dispute/statement:
    post:
      summary: The hotel's account of an open dispute
      description: 'Body: {"message": 10 to 2000 characters}. Shown to support and to the guest as the hotel''s (role "hotel"). 409 when no dispute is open. Support is emailed.'
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "400": { description: Too short or long }, "409": { description: No open dispute } }
  /admin/support/tickets/{id}/relocation:
    post:
      summary: Settle a relocation (platform admin only)
      description: |
        Body: {"outcome": "restored" | "refunded", "note": 3 to 1000 characters, shown to the guest}. restored: the booking is CONFIRMED again. refunded: the guest is
        refunded in full and the hotel bears it. 409 when it is not an open relocation.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "400": { description: Invalid }, "409": { description: Not an open relocation } }
  /partner/support/tickets:
    post:
      summary: Hotel staff write to BookDan support
      description: |
        Body as for guests: {"kind": "question" | "problem", "subject", "message", "booking_id": optional}. The booking must be one of the staff member's hotels
        (404 otherwise) and not just a hold. The request is marked with the hotel; the admins and SUPPORT_EMAIL are emailed. At most five waiting requests.
      responses: { "200": { description: "{id}" }, "400": { description: Invalid }, "404": { description: Not this hotel's booking }, "409": { description: TOO_MANY_TICKETS } }
    get:
      summary: The staff member's own requests
      responses: { "200": { description: "{tickets: [...]}" } }
  /partner/support/tickets/{id}:
    get:
      summary: One of the staff member's requests with its messages
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: "{ticket}" }, "404": { description: Not found, or a colleague's } }
  /partner/support/tickets/{id}/messages:
    post:
      summary: Reply on a request
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "404": { description: Not found }, "409": { description: Closed } }
  /partner/support/tickets/{id}/close:
    post:
      summary: Close a request
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "404": { description: Not found } }
  /partner/reviews:
    get:
      summary: Reviews of the owner's hotels (hotel owners only)
      description: The latest 100, those without a reply first. {reviews: [{id, hotel, author, rating, text, date, booking_code, reply: {text, date} | null}]}. 403 for a receptionist.
      responses: { "200": { description: OK }, "403": { description: Not an owner } }
  /partner/reviews/{id}/reply:
    put:
      summary: Write or replace the hotel's public reply to a review (hotel owners only)
      description: 'Body: {"text": 3 to 1000 characters}. The reply shows under the review on the hotel page (reviews[].reply) and on the guest''s own booking (review.hotel_reply).'
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "400": { description: Invalid text }, "403": { description: Not an owner }, "404": { description: Not a review of the owner's hotels } }
    delete:
      summary: Remove the hotel's reply (hotel owners only)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "403": { description: Not an owner }, "404": { description: Not found } }
  /partner/statements:
    get:
      summary: Monthly statements for the owner's hotels (hotel owners only)
      description: |
        Query: month=YYYY-MM (default last month; not a future month), property_id (one hotel), format=csv (one hotel only: a spreadsheet, amounts in birr, cells that
        look like formulas are defused). {statements: [{hotel, month, opening_santim, closing_santim, online_gross/commission/vat/hotel_share, pay_at_hotel_collected/commission/vat,
        paid_santim, received_santim, lines: [...], payouts: [...], receipts: [...]}]}. Lines are the stays that ended in the month (online ones with the hotel's share,
        pay-at-hotel ones with the commission owed); opening + lines - paid + received = closing. Positive balances are owed to the hotel, negative to BookDan.
        The owners are also emailed last month's statement once, after the month ends. 403 for a receptionist.
      responses: { "200": { description: OK }, "400": { description: Bad month }, "403": { description: Not an owner }, "404": { description: Not the owner's hotel } }
  /admin/hotels/{id}/statements:
    get:
      summary: A hotel's monthly statement (platform admin only)
      description: Same shape and query (month, format=csv) as /partner/statements, for any hotel.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK }, "400": { description: Bad month }, "404": { description: Unknown hotel } }
  /admin/hotels/{id}/receipts:
    post:
      summary: Record money a hotel paid BookDan (platform admin only)
      description: |
        Pay at hotel: when such a stay is completed BookDan books its commission and the VAT on it against the hotel (it reduces what BookDan owes the hotel;
        balance.owes_santim is what a hotel owes when that is more). The hotel pays by transfer and this records it. Body: {"amount_santim", "reference", "note"}; the amount
        cannot exceed what the hotel owes (409). Append-only, like a payout.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: "{receipt_id, balance}" }, "400": { description: Invalid }, "409": { description: More than the hotel owes } }
  /partner/bookings/{id}/guest/reveal:
    post:
      summary: Show the full ID number of the guest on one booking
      description: |
        The only way a hotel can read a full number. Only staff of the hotel that holds the booking. Writes an
        audit_log entry (who, which booking, when) before answering, and is rate-limited. Returns id_number.
        Fails with 410 GONE once the number was erased after the retention period.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /partner/bookings:
    get:
      summary: Partner inbox, with hotel_deadline_at per booking
      responses: { "200": { description: OK } }
  /partner/bookings/{id}/accept:
    post:
      summary: Accept a booking
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /partner/bookings/{id}/decline:
    post:
      summary: Decline a booking (reason required)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /partner/rooms:
    get:
      summary: Rooms and per-night states for the tape chart
      responses: { "501": { $ref: "#/components/responses/NotImplemented" } }
  /partner/checkin/sync:
    post:
      summary: Send check-ins that were made offline
      description: |
        Body: {"items": [{"token": "the guest's voucher QR text", "at": "RFC 3339: when the guest was checked in, by the phone's clock"}]}, 1 to 100 at a time.
        The partner app verifies the voucher signature on the phone (the public key is cached from GET /keys/voucher) and queues the check-in; this applies the queue
        when the phone is online. The server verifies each voucher again, finds the booking, and applies the check-in only when the booking is still CONFIRMED and the moment
        falls inside the stay. {results: [{reference, result}]} with result checked_in, already (a repeat is harmless), cancelled, wrong_hotel, invalid, not_found, too_early,
        ended, not_ready or bad_time (a moment in the future or more than 30 days old). The recorded check-in time is the one sent.
      responses: { "200": { description: One result per item }, "400": { description: No items, or more than 100 } }
  /partner/checkin/lookup:
    post:
      summary: Find the booking behind a guest voucher and say whether it can be checked in (changes nothing)
      description: |
        Body: { token } (the text of the voucher QR code, signature checked here) or { reference, pin }. Returns { state, booking } with state ready,
        checked_in, too_early, ended, cancelled, waiting or not_ready. Errors: INVALID_VOUCHER, VOUCHER_EXPIRED, WRONG_HOTEL, INVALID_PIN, PIN_LOCKED
        (5 wrong PINs lock the booking for 30 minutes; the QR still works).
      responses: { "200": { description: Found } }
  /partner/bookings/{id}/check-in:
    post:
      summary: Mark the guest as arrived (harmless to repeat)
      description: Allowed from the check-in date until 06:00 on the check-out date (Addis Ababa time) for a confirmed booking. INVALID_STATE otherwise.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: The booking, now CHECKED_IN } }
  /partner/rooms:
    get:
      summary: The hotel's rooms chart (query: property_id?, from?, days? up to 31)
      description: Per room type and night - capacity, booked (guests who booked in the app), held (being paid), blocked (the hotel's own walk-ins and blocks) and free.
      responses: { "200": { description: The chart } }
  /partner/rooms/blocks:
    get:
      summary: Walk-ins and blocks that are still on
      responses: { "200": { description: Blocks } }
    post:
      summary: Record a walk-in guest or block rooms
      description: Body { property_id?, room_type_id, check_in, check_out, rooms, kind walk_in|block, guest_name (walk-in), guest_phone?, note? }. The rooms are taken for every night or none (SOLD_OUT).
      responses: { "200": { description: Recorded } }
  /partner/rooms/blocks/{id}:
    delete:
      summary: Give the rooms back (harmless to repeat)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Released } }
  /partner/bookings/{id}/no-show:
    post:
      summary: Mark a guest who did not arrive (a confirmed booking, from its check-in day)
      description: The hotel keeps its share and it becomes payable; the nights still to come are free again. INVALID_STATE otherwise.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: The booking, now NO_SHOW } }
  /partner/earnings:
    get:
      summary: What the owner's hotels earned and were paid (owners only; FORBIDDEN for receptionists)
      description: |
        Per hotel: ready_santim (guest checked in or stay over), upcoming_santim (stay still to come, not payable), paid_santim, to_pay_santim
        (ready minus paid), then one line per online-paid booking (gross, commission, VAT, net) and the payouts so far.
      responses: { "200": { description: Earnings } }
  /admin/hotels/{id}/rooms/{room}/photos:
    post:
      summary: Add a photo to one room type (multipart field "photo"; at most 10 per room)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Added; the same cover and delete endpoints as hotel photos apply } }
  /admin/coupons:
    get:
      summary: Platform admin. Every coupon with how often it was used and what it cost BookDan
      responses: { "200": { description: Coupons } }
    post:
      summary: Platform admin. Create a coupon
      description: Body { code, kind percent|fixed, value (basis points or santim), max_discount_santim?, min_subtotal_santim?, starts_on?, ends_on?, max_uses?, per_user_limit, first_booking_only, property_id?, active }.
      responses: { "200": { description: Created } }
  /admin/coupons/{id}:
    put:
      summary: Platform admin. Change a coupon's rules or switch it on or off (the code never changes)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Saved } }
  /admin/payouts:
    get:
      summary: Platform admin. Every hotel's money position and its payout account
      responses: { "200": { description: Hotels with ready, upcoming, paid and to-pay amounts } }
  /admin/hotels/{id}/payouts:
    get:
      summary: Platform admin. Payout history of a hotel
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Payouts, newest first } }
    post:
      summary: Platform admin. Record a transfer that was made to the hotel
      description: Body { amount_santim, reference, note? }. At most what is ready to pay (INVALID_STATE otherwise) and the hotel needs its business record. Writes a balanced ledger transaction and an audit entry, and emails the owners.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Recorded } }
  /webhooks/payments/{provider}:
    post:
      summary: A payment gateway reports a result (signed)
      description: |
        Body: { event_id, payment_ref, status: succeeded | failed }. The header X-Signature is the hex HMAC-SHA256 of the raw body with
        PAYMENT_WEBHOOK_SECRET; anything else is 401. An event id is handled once, so retries by the gateway are safe.
      responses: { "200": { description: Recorded } }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    NotImplemented:
      description: Endpoint exists in the contract but is not built yet
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [server_time, status]
      properties:
        server_time: { type: string, format: date-time }
        status: { type: string, example: ok }
        env: { type: string }
    Error:
      type: object
      required: [server_time, error]
      properties:
        server_time: { type: string, format: date-time }
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable code, e.g. HOLD_CONFLICT, HOLD_EXPIRED, PAYMENT_FAILED, VOUCHER_NOT_READY, SYNC_COLLISION, NOT_IMPLEMENTED
            message: { type: string }
            request_id: { type: string }
            details: {}
    Currency:
      type: string
      enum: [ETB, USD, EUR]
    BookingStatus:
      type: string
      enum:
        - HELD
        - PAID_AWAITING_HOTEL
        - CONFIRMED
        - CHECKED_IN
        - COMPLETED
        - EXPIRED
        - DECLINED_REFUNDED
        - CANCELLED_REFUNDED
        - NO_SHOW
        - NEEDS_RELOCATION
        - DISPUTED
