openapi: 3.0.3
info:
  title: BookDan API
  version: 0.1.0
  description: |
    Contract between the Go backend and the mobile apps. This file is the single source of truth:
    the mobile API client is generated from it, and a change here must fail the mobile build if the app no longer matches.

    Conventions
    - Base path /v1 over HTTPS.
    - Request headers: Authorization (Bearer), Accept-Language (en, am, om, ti), X-App (guest or partner), X-Device-Id (the install's id, 8+ characters),
      X-Platform (android, ios), X-App-Version. Creating a hold also sends Idempotency-Key.
    - Endpoints marked 200 are built (internal/api); 501 NOT_IMPLEMENTED means not built yet.
    - Every response body includes server_time (apps use it for countdowns, never the phone clock).
    - Money fields end in _santim and are integers, with a currency field beside them.
    - Errors use one shape: code, message, request_id, details.
    - Lists use cursor pagination: items and next_cursor.
servers:
  - url: http://localhost:8080/v1
paths:
  /healthz:
    get:
      summary: Liveness check
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /auth/otp/request:
    post:
      summary: Send a one-time code by SMS (phone) or email
      description: |
        Body: { "type": "phone" | "email", "value": "+2519..." | "name@example.com" }. Phones are Ethiopian (+2519 or +2517);
        email is for visitors without an Ethiopian number and is lower-cased. At most 5 codes per identifier per 10 minutes (429 TOO_MANY_REQUESTS).
        Codes last 5 minutes. Errors: INVALID_PHONE, INVALID_EMAIL.
      responses: { "200": { description: Code sent } }
  /auth/otp/verify:
    post:
      summary: Exchange the identity plus code for access and refresh tokens
      description: |
        Body: { "type", "value", "code" }. Headers X-App and X-Device-Id are required. Five wrong codes spend the challenge.
        Response: { token, refresh_token }. The access token lasts 15 minutes. The partner app admits only hotel staff (403 NOT_STAFF).
        Errors: INVALID_OTP.
      responses: { "200": { description: Signed in } }
  /auth/refresh:
    post:
      summary: Trade a refresh token for a new pair (rotation)
      description: |
        Body: { "refresh_token" }. A refresh token works once. Presenting a used one means a copy leaked: the whole session family is revoked
        and every token in it fails with 401 UNAUTHENTICATED.
      responses: { "200": { description: New tokens } }
  /keys/voucher:
    get:
      summary: The public key that verifies voucher QR codes offline (Ed25519)
      responses: { "200": { description: "kid, alg and public_key (base64url)" } }
  /search:
    get:
      summary: Search properties by landmark, city, name or coordinates
      responses: { "200": { description: OK } }
  /properties/{id}:
    get:
      summary: Property detail with room types, prices and reviews
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /quotes:
    post:
      summary: Price a stay (valid 10 minutes)
      description: |
        Body: { property_id, room_type_id, check_in, check_out, guests, rooms? } (1 to 9 rooms of one type; guests >= rooms).
        Amounts cover all rooms: nightly_santim is one room for one night; subtotal_santim, vat_santim and total_santim are for the stay.
        Errors: SOLD_OUT (not enough rooms for every night), INVALID_STATE (too many guests, no price for those dates), PRICING_NOT_CONFIRMED.
      responses: { "200": { description: Quote } }
  /bookings:
    get:
      summary: The signed-in guest's bookings
      responses: { "200": { description: OK } }
    post:
      summary: Hold the rooms for 15 minutes. Requires Idempotency-Key.
      description: |
        Body: { quote_id, guest_name }. Takes every room on every night, or none. Freezes a copy of the guest's profile for the hotel.
        The same key and request returns the same booking; the same key with another request is IDEMPOTENCY_MISMATCH.
        Errors: QUOTE_EXPIRED, SOLD_OUT, PROFILE_INCOMPLETE.
      responses: { "200": { description: Booking (HELD) } }
  /bookings/{id}:
    get:
      summary: Booking status and amounts
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /bookings/{id}/pay:
    post:
      summary: Start payment; returns a payment_url (mock gateway in the demo)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /bookings/{id}/cancel:
    post:
      summary: Cancel a booking that is waiting for the hotel or confirmed
      description: |
        Refund rule: everything back while the hotel has not answered; after it confirmed, everything back until 48 hours before check-in (12:00 Addis time), nothing after. The booking response says in advance what applies: can_cancel, refund_if_cancelled_santim, full_refund_until. Errors: INVALID_STATE, CANCEL_TOO_LATE (the stay has started). Returns the booking with refund_santim.
      responses: { "200": { description: Booking (cancelled) } }
  /bookings/{id}/review:
    post:
      summary: Review a finished stay (once per booking)
      description: |
        Body: { rating 1-5, text up to 1000 characters }. Errors: REVIEW_NOT_READY (before check-out), ALREADY_REVIEWED. Returns the booking with review.
      responses: { "200": { description: Booking (with the review) } }
  /bookings/{id}/voucher:
    get:
      summary: Signed voucher token and PIN (PIN shown once)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /partner/devices/push-token:
    put:
      summary: Register this phone for new-booking alerts
      description: |
        Body: token (the phone's FCM token), token_type "fcm", device_id (the X-Device-Id), platform, app_version.
        Replaces any earlier token for the same device. When a guest pays, the server pushes
        { "type": "new_booking", "booking_id": "..." } to the hotel's registered phones on the Android channel
        "booking_alerts" (highest importance, its own sound). The countdown and the escalation chain
        (Telegram, SMS, automated call) run on the server; the app only shows the countdown.
      responses: { "200": { description: OK } }
  /me/profile:
    get:
      summary: The signed-in guest's own profile (masked), or 404 if they have not filled it in
      description: |
        Returns full_name, id_type, id_last4, nationality. Never the full ID number.
      responses: { "200": { description: OK } }
    put:
      summary: Save the guest's name, ID and nationality
      description: |
        Body: full_name, id_type (national_id, passport, driving_licence, residence_permit, other), id_number,
        nationality. The server normalises the number (INVALID_ID if it cannot be an ID), encrypts it (AES-GCM, key
        kept outside the database), and stores a keyed hash and the last four characters. Requires Idempotency-Key.
      responses: { "200": { description: OK } }
    delete:
      summary: Remove the guest's ID details
      description: Deletes the profile. Copies already given to hotels for requested stays stay until the retention job erases them.
      responses: { "200": { description: OK } }
  /partner/bookings/{id}/guest/reveal:
    post:
      summary: Show the full ID number of the guest on one booking
      description: |
        The only way a hotel can read a full number. Only staff of the hotel that holds the booking. Writes an
        audit_log entry (who, which booking, when) before answering, and is rate-limited. Returns id_number.
        Fails with 410 GONE once the number was erased after the retention period.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /partner/bookings:
    get:
      summary: Partner inbox, with hotel_deadline_at per booking
      responses: { "200": { description: OK } }
  /partner/bookings/{id}/accept:
    post:
      summary: Accept a booking
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /partner/bookings/{id}/decline:
    post:
      summary: Decline a booking (reason required)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: OK } }
  /partner/rooms:
    get:
      summary: Rooms and per-night states for the tape chart
      responses: { "501": { $ref: "#/components/responses/NotImplemented" } }
  /partner/sync/push:
    post:
      summary: Apply queued offline actions; idempotent per action_id
      responses: { "501": { $ref: "#/components/responses/NotImplemented" } }
  /partner/sync/pull:
    get:
      summary: Changes since a cursor (bookings, rooms, cancelled codes)
      responses: { "501": { $ref: "#/components/responses/NotImplemented" } }
  /partner/checkin/lookup:
    post:
      summary: Find the booking behind a guest voucher and say whether it can be checked in (changes nothing)
      description: |
        Body: { token } (the text of the voucher QR code, signature checked here) or { reference, pin }. Returns { state, booking } with state ready,
        checked_in, too_early, ended, cancelled, waiting or not_ready. Errors: INVALID_VOUCHER, VOUCHER_EXPIRED, WRONG_HOTEL, INVALID_PIN, PIN_LOCKED
        (5 wrong PINs lock the booking for 30 minutes; the QR still works).
      responses: { "200": { description: Found } }
  /partner/bookings/{id}/check-in:
    post:
      summary: Mark the guest as arrived (harmless to repeat)
      description: Allowed from the check-in date until 06:00 on the check-out date (Addis Ababa time) for a confirmed booking. INVALID_STATE otherwise.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: The booking, now CHECKED_IN } }
  /partner/earnings:
    get:
      summary: What the owner's hotels earned and were paid (owners only; FORBIDDEN for receptionists)
      description: |
        Per hotel: ready_santim (guest checked in or stay over), upcoming_santim (stay still to come, not payable), paid_santim, to_pay_santim
        (ready minus paid), then one line per online-paid booking (gross, commission, VAT, net) and the payouts so far.
      responses: { "200": { description: Earnings } }
  /admin/payouts:
    get:
      summary: Platform admin. Every hotel's money position and its payout account
      responses: { "200": { description: Hotels with ready, upcoming, paid and to-pay amounts } }
  /admin/hotels/{id}/payouts:
    get:
      summary: Platform admin. Payout history of a hotel
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Payouts, newest first } }
    post:
      summary: Platform admin. Record a transfer that was made to the hotel
      description: Body { amount_santim, reference, note? }. At most what is ready to pay (INVALID_STATE otherwise) and the hotel needs its business record. Writes a balanced ledger transaction and an audit entry, and emails the owners.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Recorded } }
  /webhooks/payments/{provider}:
    post:
      summary: A payment gateway reports a result (signed)
      description: |
        Body: { event_id, payment_ref, status: succeeded | failed }. The header X-Signature is the hex HMAC-SHA256 of the raw body with
        PAYMENT_WEBHOOK_SECRET; anything else is 401. An event id is handled once, so retries by the gateway are safe.
      responses: { "200": { description: Recorded } }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    NotImplemented:
      description: Endpoint exists in the contract but is not built yet
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Health:
      type: object
      required: [server_time, status]
      properties:
        server_time: { type: string, format: date-time }
        status: { type: string, example: ok }
        env: { type: string }
    Error:
      type: object
      required: [server_time, error]
      properties:
        server_time: { type: string, format: date-time }
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable code, e.g. HOLD_CONFLICT, HOLD_EXPIRED, PAYMENT_FAILED, VOUCHER_NOT_READY, SYNC_COLLISION, NOT_IMPLEMENTED
            message: { type: string }
            request_id: { type: string }
            details: {}
    Currency:
      type: string
      enum: [ETB, USD, EUR]
    BookingStatus:
      type: string
      enum:
        - HELD
        - PAID_AWAITING_HOTEL
        - CONFIRMED
        - CHECKED_IN
        - COMPLETED
        - EXPIRED
        - DECLINED_REFUNDED
        - CANCELLED_REFUNDED
        - NO_SHOW
        - NEEDS_RELOCATION
        - DISPUTED
