name: backend

on:
  pull_request:
    paths: ["backend/**"]
  push:
    branches: [main]
    paths: ["backend/**"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # includes the database tests, which start an embedded PostgreSQL
      - run: go test ./... -race
      - run: go build ./...
